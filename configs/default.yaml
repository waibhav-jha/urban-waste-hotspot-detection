# ==============================================================================
# Configuration: Satellite & Aerial Urban Waste Hotspot Detection Pipeline
# ==============================================================================

system:
  seed: 42
  device: "cuda"  # Auto-falls back to "cpu" if CUDA is unavailable

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  splits_dir: "data/processed/splits"
  artifacts_dir: "artifacts"
  outputs_dir: "outputs"
  checkpoint_path: "artifacts/best_model.pth"

dataset:
  name: "AerialWaste"
  zenodo_record_id: "7991872"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4
  class_names:
    - "non_waste"
    - "waste"

preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  rotation_degrees: 15
  brightness_jitter: 0.1
  contrast_jitter: 0.1

model:
  backbone: "resnet50"
  num_classes: 2
  pretrained: true
  freeze_backbone: false

training:
  epochs: 25
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001

evaluation:
  calibration_metric: "f1"  # "f1" or "recall_target"
  target_recall: 0.85
  default_threshold: 0.50

tiling:
  tile_size: 256
  overlap: 0.20

clustering:
  algorithm: "dbscan"
  eps_meters: 250.0
  min_samples: 3
  metric_crs: "EPSG:3857"
